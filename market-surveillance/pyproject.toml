[project]
name = "market-surveillance"
version = "0.1.0"
description = "Market-abuse screens (pre-announcement event study) and a MiFIR RTS 22 transaction-report validator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
bloomberg = ["xbbg>=0.7"]  # needs a logged-in Terminal and blpapi; see docs/bloomberg-pull.md
plots = ["matplotlib>=3.11.2"]  # scripts/plot_pull_diagnostics.py

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketsurv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
