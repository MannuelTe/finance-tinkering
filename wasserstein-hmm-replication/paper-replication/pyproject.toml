[project]
name = "wasserstein-hmm-replication"
version = "0.1.0"
description = "Replication of Boukardagha (2026), arXiv:2603.04441, Explainable Regime Aware Investing."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "hmmlearn>=0.3.3",
    "matplotlib>=3.9",
    "yfinance>=0.2.44",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasserstein_hmm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
# Style, docstring, and complexity checks are covered by ruff; pylint gates on errors/warnings.
disable = ["C", "R"]
