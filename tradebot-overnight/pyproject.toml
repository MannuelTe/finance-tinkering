[project]
name = "tradebot"
version = "0.1.0"
description = "Personal automated trading bot (IBKR paper/live) with sim backtesting."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "ib-async>=1.0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "yfinance>=0.2.44",
    "streamlit>=1.38",
    "httpx>=0.27",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
paper = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv.nosync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
